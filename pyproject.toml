[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-brain-public"
version = "1.0.0"
description = "A policy-driven AI sales planning service with evidence-backed, plan-only outputs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "FivePointAIStudio"}]
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.30", "psycopg[binary]>=3.2",
  "httpx>=0.27", "jsonschema>=4.20", "pydantic>=2.8", "PyMySQL>=1.1"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sales-brain-migrate = "sales_brain.db:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_contracts = ["schemas/**/*.json"]

[tool.setuptools.data-files]
"share/sales-brain-public/migrations" = ["migrations/*.sql"]
"share/sales-brain-public/admin-ui" = ["admin-ui/*.json"]
"share/sales-brain-public" = ["README.md", "SECURITY.md", "THIRD_PARTY_NOTICES"]
"share/sales-brain-public/examples" = ["examples/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
